<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>바이브 룸 (Vibe Room)</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="바이브 룸">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
    }

    /* 화면 전체를 가득 채우는 제로 딜레이 아이프레임 */
    #vibe-frame {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      outline: 0;
      display: block;
      background: #090d16;
    }
  </style>
</head>
<body>
  <iframe 
    id="vibe-frame" 
    src="https://photographers-hometown-identify-sells.trycloudflare.com" 
    allow="camera; microphone; clipboard-read; clipboard-write; geolocation; fullscreen; display-capture"
    title="Vibe Room"
  ></iframe>

  <script>
    // PWA Service Worker 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Expo Go 앱 스킴 최상단 프레임 실행 리스너 (아이프레임 내 차단 우회)
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'OPEN_EXPO' && event.data.url) {
        window.location.href = event.data.url;
      }
    });

    // URL 쿼리에 expo_url이 포함된 경우 바로 연결 센터로 이동
    const urlParams = new URLSearchParams(window.location.search);
    const targetExpoUrl = urlParams.get('expo_url');
    if (targetExpoUrl) {
      const targetName = urlParams.get('name') || '';
      const iframe = document.getElementById('vibe-frame');
      if (iframe) {
        iframe.src = 'https://photographers-hometown-identify-sells.trycloudflare.com/expo-launch?url=' + encodeURIComponent(targetExpoUrl) + '&name=' + encodeURIComponent(targetName);
      }
    }
  </script>
</body>
</html>

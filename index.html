<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>바이브 룸 (Vibe Room)</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="바이브 룸">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: constant(safe-area-inset-top);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: constant(safe-area-inset-bottom);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: constant(safe-area-inset-left);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: constant(safe-area-inset-right);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* 화면 전체를 가득 채우는 제로 딜레이 아이프레임 */
    #vibe-frame {
      width: 100%;
      height: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
      outline: 0;
      display: block;
      background: #090d16;
    }
  </style>
</head>
<body>
  <iframe 
    id="vibe-frame" 
    src="https://contract-debug-tall-chester.trycloudflare.com" 
    allow="camera; microphone; clipboard-read; clipboard-write; geolocation; fullscreen; display-capture"
    title="Vibe Room"
  ></iframe>

  <script>
    // 1. PWA Service Worker 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // 2. 게이트웨이(1차 도메인)에 영구 저장된 로그인/PIN 상태 복원하여 아이프레임에 자동 전달!
    const isAuthed = localStorage.getItem('vibe_auth') === 'true';
    const savedPin = localStorage.getItem('vibe_saved_pin') || '';
    const iframe = document.getElementById('vibe-frame');

    // URL 쿼리에 expo_url이 포함된 경우 바로 연결 센터로 이동
    const urlParams = new URLSearchParams(window.location.search);
    const targetExpoUrl = urlParams.get('expo_url');
    if (targetExpoUrl) {
      const targetName = urlParams.get('name') || '';
      if (iframe) {
        iframe.src = 'https://contract-debug-tall-chester.trycloudflare.com/expo-launch?url=' + encodeURIComponent(targetExpoUrl) + '&name=' + encodeURIComponent(targetName);
      }
    } else if (iframe && isAuthed) {
      const currentSrc = iframe.src;
      const delimiter = currentSrc.includes('?') ? '&' : '?';
      iframe.src = currentSrc + delimiter + 'auth=1' + (savedPin ? '&saved_pin=' + encodeURIComponent(savedPin) : '');
    }

    // 3. 메시지 이벤트 수신 (Expo 앱 실행 및 로그인 상태 영구 동기화)
    window.addEventListener('message', (event) => {
      if (!event.data) return;

      // Expo Go 앱 스킴 최상단 프레임 실행 리스너 (아이프레임 내 차단 우회)
      if (event.data.type === 'OPEN_EXPO' && event.data.url) {
        window.location.href = event.data.url;
      }

      // 로그인 인증 상태 영구 동기화 (아이폰 사파리 ITP 스토리지 삭제 방어)
      if (event.data.type === 'SET_AUTH') {
        if (event.data.auth) {
          localStorage.setItem('vibe_auth', 'true');
          if (event.data.pin) localStorage.setItem('vibe_saved_pin', event.data.pin);
          if (event.data.role) localStorage.setItem('vibe_role', event.data.role);
        } else {
          localStorage.removeItem('vibe_auth');
          localStorage.removeItem('vibe_saved_pin');
          localStorage.removeItem('vibe_role');
        }
      }
    });
  </script>
</body>
</html>
